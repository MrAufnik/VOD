name: VOD - All Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scrape all channels
        run: |
          for channel in 11 12 13 23 24; do
            python -m scripts.run_channel --channel "$channel"
          done
      - name: Commit all channel JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel_11.json data/channel_12.json data/channel_13.json data/channel_23.json data/channel_24.json
          git diff --cached --quiet || git commit -m "Update VOD catalogs for all channels"
          git push

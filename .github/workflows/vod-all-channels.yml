name: VOD - All Channels

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Comma-separated channel IDs (11,12,13,23,24)"
        required: false
        default: "11,12,13,23,24"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [11, 12, 13, 23, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.run_channel --channel ${{ matrix.channel }}
      - name: Commit channel JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel_${{ matrix.channel }}.json
          git diff --cached --quiet || git commit -m "Update VOD channel ${{ matrix.channel }} data"
          git push

name: VOD Scraper CI

on:
  push:
    branches:
      - feature/channel-vod-scrapers
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run parser unit tests
        run: python -m unittest discover -s tests -v
